<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Chefanane Davet</title>
<style>
  :root { --bg: #F1E8D8; --text: #2B2118; --muted: #706150; }

  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center;
  }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Chefanane</h1>
  <p>Bu adres yalnızca aile davet bağlantıları içindir.</p>
